<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
   <style>
    * { 
      box-sizing: border-box;
    }
    body {
        margin: 20px;
        box-sizing: border-box;
        background: #8bdfe0;
        background: linear-gradient(0deg, rgba(139, 223, 224, 1) 0%, rgba(232, 208, 149, 1) 83%, rgba(222, 193, 131, 1) 100%);
    }

    h1 {
        text-align: center;
    }

    form {
        max-width: 70%;
        margin: 0 auto;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
    }

    input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        font-size: 15px;
        margin-bottom: 10px;
    }

    .row {
        display: flex;
        gap: 15px;
    }

    .row input {
        flex: 1;
    }

     .robot {
        border: 1px solid black;
        width: 300px;
        max-width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 auto;
        flex-wrap: wrap;
      }
      .check {
        width: 20px;
        height: 20px;
        margin-right: 10px;
        margin-left: 20px;
      }
      .left {
        display: flex;
        align-items: center;
      }
      .right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 15px 10px;
      }
      .icon {
        width: 25px;
        height: 25px;
      }
      p {
        margin: 0;
      }
      .button {
        display: flex;
        justify-content: center;
      }
      button {
        width: 100px;
        height: 50px;
        background-color: rgb(45, 45, 242);
        border: 0px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
      }
      .Verification {
        display: flex;
        justify-content: center;
        max-width: 300px;
        margin: 0 auto;
      }
      @media (max-width: 600px) {
        .row { flex-direction: column;}
        form { max-width: 95%; }
      }
   </style>
  </head>
  <body>
    <form action="">
        <div>
            <h1>School Championship Registration Form</h1>
            <label for="school_name">School Name:</label>
            <input name="school_name" type="text"/>
        </div>

        <div>
            <label>Schooler Name:</label>
            <div class="row">
                <input name="schooler_first" type="text" placeholder="First"/>
                <input name="schooler_last" type="text" placeholder="Last"/>
            </div>
        </div>

        <div>
            <label>Parent Name:</label>
            <div class="row">
                <input name="parent_first" type="text" placeholder="First"/>
                <input name="parent_last" type="text" placeholder="Last"/>
            </div>
        </div>

        <div>
            <label for="phone">Parent Phone:</label>
            <input id="phone" name="phone_number" type="tel" placeholder="### ### ####"/>
        </div>

        <div>
            <label for="email">Parent Email:</label>
            <input id="email" name="email" type="email"/>
        </div>

        <div>
            <label for="sport">Preferred Sport:</label>
            <input id="sport" name="preferred_sport" type="text"/>
        </div>
        <div class="Verification">
            <label for="Verification">Verification:</label>
        </div>
         <div class="robot">
      <div class="left">
        <input class="check" type="checkbox" />
        <span>I am not a robot</span>
      </div>
      <div class="right">
        <div>
          <img class="icon" src="form/recycle.png" alt="" />
        </div>
        <p>reCAPTCHA</p>
      </div>
    </div>
    <div class="button">
        <button>Submit</button>
    </div>
    </form>
  </body>
</html>
